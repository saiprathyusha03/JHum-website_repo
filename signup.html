<!DOCTYPE html>
<html>
    <head>
        <title>Sign up</title>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=0.1">
        <link rel="stylesheet" href="https://use.fontawesome.com/releases/v5.0.7/css/all.css">
        <link rel="preload">
        <link rel="stylesheet" href="https://fonts.googleapis.com/css?family=Sofia">
        <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
        <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
        <style>
            body{
                background: url("image/login-background.jpg") no-repeat center/cover;
            }
            .container{
                /*background-color: red;*/
                min-height: 600px ;
                box-sizing: border-box;
                width: 600px;
                margin: auto;
               
            }
            
            .main-class h2{
                text-align: center;
                margin: 30px;
                color: antiquewhite;
                margin-top: 30px;
                
                
            }

            #cls-h2{
                float: right;
                
                padding: 10px;
                margin-right: 20px;
                font-family: sofia;
                color: #414a4c;
                text-shadow: 2px 2px 1px black;
            }
            .main-class{
               /* background-color: yellow;*/
                margin-top: 40px;
                margin-right: 130px;
                min-height: 400px;
                padding: 60px;
                width: 600px;
               

            }

            .input-container{
                display: flex;
            }
            input[type=text], input[type=password], input[type=email]{
                width: 100%;
                border: none;
                margin: 20px;
                border-radius: 20px;
                padding: 10px;
            }
            .icon{
                padding: 10px;
                margin: 20px;
                color: white;
            }

            button{
                width: 100%;
                background-image: linear-gradient(#3b3c36,#414a4c);
                border-radius: 20px;
                padding: 10px;
                margin: 20px;
                color: antiquewhite;
                cursor: pointer;
                
                border: none;
            }
            button:hover{
                opacity: 0.5;
            }
            input[type=text]:hover,input[type=password]:hover, input[type=email]:hover{
                background-color: #3b3c36;
                opacity: 0.5;
                border: none;
            }
            input[type=text]:focus,input[type=password]:focus, input[type=email]:focus{
                background-color: #ddd;
                outline: none;
            }
            .valid {
            color: green;
            }

            .valid:before {
            position: relative;
            left: -35px;
            content: "✔";
            
            }

            /* Add a red text color and an "x" when the requirements are wrong */
            .invalid {
            color: red;
            }

            .invalid:before {
            position: relative;
            left: -35px;
            content: "✖";
            }

            #message{
                display: none;
                margin: auto;
                width: 500px;
                
            }
            #message h4{
                color: #ddd;
            }
            
            @media(max-width: 600px){
                *{
                    margin: 0;
                    padding: 0;
                }
                .main-class{
                    
                    margin: 0;
                }

                .main-class h2{
                    min-width: 50px;
                    margin-left: -300px;
                }
                .input-container{
                    margin: 0;
                    
                    margin-left: -50px;
                }
                input[type=text], input[type=password], input[type=email]{
                    margin-left: -20px;
                    width: 380px;
                }
                button{
                    width: 200px;
                }
                #message{
                    margin-left:100px ;
                }
                
            }
        </style>
        
    </head>

    <body>
        <div>
            <h3 id="cls-h2">JHum lyrics</h3>
        </div>
        <div class="container">
        
            <div class="main-class">
              <form id="signup-form" onsubmit="return validateform()">
                <h2>Create Account</h2>
                <div class="input-container">
                <i class="fa fa-user icon"></i>
                <input type="text" id="fname" name="fname" placeholder="username" required>
                <br><br>
            </div>
            <div class="input-container">
                <i class="fa fa-envelope icon"></i>
                <input type="email" id="mail" name="mail" placeholder="Email" required>
                <br><br>
            </div>
            <div class="input-container">
                <i class="fa fa-key icon"></i>
                <input type="password" id="pass" name="pass" placeholder="Enter password" pattern= "(?=.*\d)(?=.*[a-z])(?=.*[A-Z]).{8,}" title="Must contain at least one number and one uppercase and lowercase letter, 
                and at least 8 or more characters" required>  
                <br><br>
            </div>
            <div class="input-container">
                <i class="fa fa-key icon"></i>
                <input type="password" id="Cpass" name="Cpass" placeholder="confirm password" required>
                <br><br>
            </div>
                <button type="submit">Sign up</button><br>
                <label>
                  <input type="checkbox" checked="checked" name="remember"> Remember me
                </label>
              </form>
            </div>
            <div id="msg-div" class="msg-div"></div>
        </div>

        <div id="message">
            <h4>Password must contain the following:</h4>
            <p id="letter" class="invalid">A <b>lowercase</b> letter</p>
            <p id="capital" class="invalid">A <b>capital (uppercase)</b> letter</p>
            <p id="number" class="invalid">A <b>number</b></p>
            <p id="length" class="invalid">Minimum <b>8 characters</b></p>
          </div>
                  

          <script>
            var myInput = document.getElementById("pass");
            var letter = document.getElementById("letter");
            var capital = document.getElementById("capital");
            var number = document.getElementById("number");
            var length = document.getElementById("length");
            
            // When the user clicks on the password field, show the message box
            myInput.onfocus = function() {
              document.getElementById("message").style.display = "block";
            }
            
            // When the user clicks outside of the password field, hide the message box
            myInput.onblur = function() {
              document.getElementById("message").style.display = "none";
            }
            
            // When the user starts to type something inside the password field
            myInput.onkeyup = function() {
              // Validate lowercase letters
              var lowerCaseLetters = /[a-z]/g;
              if(myInput.value.match(lowerCaseLetters)) {  
                letter.classList.remove("invalid");
                letter.classList.add("valid");
              } else {
                letter.classList.remove("valid");
                letter.classList.add("invalid");
              }
              
              // Validate capital letters
              var upperCaseLetters = /[A-Z]/g;
              if(myInput.value.match(upperCaseLetters)) {  
                capital.classList.remove("invalid");
                capital.classList.add("valid");
              } else {
                capital.classList.remove("valid");
                capital.classList.add("invalid");
              }
            
              // Validate numbers
              var numbers = /[0-9]/g;
              if(myInput.value.match(numbers)) {  
                number.classList.remove("invalid");
                number.classList.add("valid");
              } else {
                number.classList.remove("valid");
                number.classList.add("invalid");
              }
              
              // Validate length
              if(myInput.value.length >= 8) {
                length.classList.remove("invalid");
                length.classList.add("valid");
              } else {
                length.classList.remove("valid");
                length.classList.add("invalid");
              }
            }

            function validateform(){
                let pass1 = document.forms["signup-form"]["pass"].value
                let Cpass1 = document.forms["signup-form"]["Cpass"].value
                if(pass1 != Cpass1){
                    alert('Password and confirm password should be same')
                }
            }
            console.log(myInput)


           
    // Handle form submission
    const form = document.getElementById('signup-form');
    const messageDiv = document.getElementById('msg-div');

    form.addEventListener('submit', function(e) {
        e.preventDefault(); // Prevent default form submission

        // Gather form data
        const formData = {
            name: form.fname.value.trim(),
            email: form.mail.value.trim(),
            password: form.pass.value.trim()
        };

        // Send data to the server via Fetch API
        fetch('http://localhost:3000/signup', {
            method: 'POST',
            headers: {
                'Content-Type': 'application/json'
            },
            body: JSON.stringify(formData)
        })

        .then(response => {
    // Check if the response status is OK
        if (!response.ok) {
            // Throw an error if the response status is not OK
            throw new Error('Network response was not ok: ' + response.statusText);
        }
        return response.json(); // Parse the JSON
        alert('Network response was not ok: ' + response.statusText)
    })
        //.then(response => response.json())
        .then(data => {
            messageDiv.style.display = 'block';
            if (data.status === 'success') {
                messageDiv.className = 'message success';
                messageDiv.textContent = data.message;
                form.reset(); // Reset the form upon success
            } else {
                messageDiv.className = 'message error';
                messageDiv.textContent = data.message;
            }
            alert(data.message)
        })
        .catch(error => {
            messageDiv.style.display = 'block';
            messageDiv.className = 'message error';
            messageDiv.textContent = 'An error occurred. Please try again.';
            console.error('Error:', error);
            alert(error);
        });
        
    });
</script>
          

    </body>
</html>
